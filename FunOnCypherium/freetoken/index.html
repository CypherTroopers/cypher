<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cypherium Token Generator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/CypherTroopers/logo/main/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/CypherTroopers/logo/main/android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="https://raw.githubusercontent.com/CypherTroopers/logo/main/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/menu.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>
  <div class="background-spinner"></div>
  <div class="metallic-sheen"></div>
  <div class="grid-overlay"></div>

  <main class="main-content">
    <section class="panel">
      <h1>Create Your Token - Fun on Cypherium -</h1>
      <p class="intro">Craft a Cypherium token with a few simple details and deploy it directly from your browser. The metallic interface guides you every step of the way.</p>
      <form id="tokenForm" class="token-form">
        <label for="name">Token Name</label>
        <input type="text" id="name" placeholder="e.g. Cypher Star" required />
        <label for="symbol">Symbol</label>
        <input type="text" id="symbol" placeholder="e.g. CSTR" required />
        <label for="totalSupply">Total Supply</label>
        <input type="number" id="totalSupply" placeholder="e.g. 1000000" required />
        <button type="submit">Deploy Token</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("tokenForm");
    const statusElement = document.getElementById("status");
    const deployButton = form.querySelector("button[type='submit']");

    const resetStatusState = () => {
      statusElement.classList.remove("status--in-progress", "status--success", "status--error");
      statusElement.removeAttribute("aria-busy");
    };

    const createStatusHighlight = (label, value) => {
      const container = document.createElement("div");
      container.className = "status-highlight";

      const labelElement = document.createElement("span");
      labelElement.className = "status-label";
      labelElement.textContent = label;

      const valueElement = document.createElement("code");
      valueElement.textContent = value;

      container.append(labelElement, valueElement);
      return container;
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const symbol = document.getElementById("symbol").value;
      const totalSupply = document.getElementById("totalSupply").value;

      if (!name || name.length > 50) return alert("Token name must be between 1 and 50 characters.");
      if (!symbol || symbol.length > 10) return alert("Token symbol must be between 1 and 10 characters.");
      if (!totalSupply || totalSupply <= 0) return alert("Total supply must be a positive number.");
      if (!window.ethereum) return alert("MetaMask is not installed!");

      resetStatusState();
      statusElement.textContent = "";
      deployButton.disabled = true;

      try {
        await window.ethereum.request({ method: "eth_requestAccounts" });

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const signer = provider.getSigner();

        const { chainId } = await provider.getNetwork();
        if (chainId !== 16166) {
          throw new Error("Please connect to the Cypherium network in MetaMask.");
        }

        const { abi, bytecode } = await fetchContractData();
        const factory = new ethers.ContractFactory(abi, bytecode, signer);

        statusElement.textContent = "Token generation in progress";
        statusElement.classList.add("status--in-progress");
        statusElement.setAttribute("aria-busy", "true");

        const contract = await factory.deploy(name, symbol, totalSupply);
        await contract.deployed();

        const tokenName = await contract.name();
        const tokenSymbol = await contract.symbol();

        resetStatusState();
        statusElement.classList.add("status--success");
        statusElement.textContent = "";

        const successTitle = document.createElement("strong");
        successTitle.textContent = "Token deployed successfully!";

        const successSubtitle = document.createElement("span");
        successSubtitle.className = "status-subtitle";
        successSubtitle.textContent = "Copy your token address and import the token into your wallet.";

        statusElement.append(
          successTitle,
          successSubtitle,
          createStatusHighlight("Address", contract.address),
          createStatusHighlight("Name", tokenName),
          createStatusHighlight("Symbol", tokenSymbol)
        );
      } catch (error) {
        console.error("Deployment error:", error);
        resetStatusState();
        statusElement.classList.add("status--error");
        statusElement.textContent = `Error: ${error.message}`;
      } finally {
        deployButton.disabled = false;
        statusElement.removeAttribute("aria-busy");
      }
    });

    async function fetchContractData() {
      const abiResponse = await fetch("/abi");
      const bytecodeResponse = await fetch("/bytecode");

      const abi = await abiResponse.json();
      const bytecode = await bytecodeResponse.text();
      return { abi, bytecode };
    }

  </script>
  <script>
    window.MENU_ACTIVE_PATH = '/';
  </script>
  <script defer src="/shared/menu.js"></script>
  <footer class="site-footer">
    <a href="https://github.com/CypherTroopers/FreeTokenOnCypherium/tree/main" target="_blank" class="footer-link">
      GitHub Repository
    </a>
    <img src="https://raw.githubusercontent.com/CypherTroopers/logo/main/logo-512.png" alt="CypherTroopers Logo" class="footer-logo">
  </footer>
</body>
</html>
