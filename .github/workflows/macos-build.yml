name: macOS Build

on:
  workflow_dispatch:

  push:
    branches:
      - EVM_Cancun_PoW
    paths-ignore:
      - 'build/bin/cypher-darwin-*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            goarch: arm64

    runs-on: ${{ matrix.runner }}

    env:
      GOPATH: ${{ github.workspace }}/go
      GO111MODULE: off
      CGO_ENABLED: 1
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          ref: EVM_Cancun_PoW
          path: go/src/github.com/cypherium/cypher
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/vendor/github.com/consensys/gnark-crypto/internal/generator/addchain/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false

      - name: Setup macOS native libs
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install openssl@3 gmp

      - name: Build cypher (darwin ${{ matrix.goarch }})
        working-directory: ${{ github.workspace }}/go/src/github.com/cypherium/cypher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GOPATH/src/github.com/VictoriaMetrics"
          mkdir -p "$GOPATH/src/github.com/shirou"
          mkdir -p "$GOPATH/src/golang.org/x"
          mkdir -p "$GOPATH/src/github.com/dlclark"
          mkdir -p "$GOPATH/src/github.com/go-sourcemap"
          mkdir -p "$GOPATH/src/github.com/yusufpapurcu"
          mkdir -p "$GOPATH/src/github.com/go-ole"
          mkdir -p "$GOPATH/src/github.com/ebitengine"
          mkdir -p "$GOPATH/src/github.com/tklauser"

          git clone --depth 1 https://github.com/VictoriaMetrics/fastcache.git "$GOPATH/src/github.com/VictoriaMetrics/fastcache"
          git clone --depth 1 https://github.com/shirou/gopsutil.git "$GOPATH/src/github.com/shirou/gopsutil"
          git clone --depth 1 https://github.com/golang/sys.git "$GOPATH/src/golang.org/x/sys"

          cd "$GOPATH/src/github.com/dlclark"
          if [ ! -d regexp2 ]; then
            git clone https://github.com/dlclark/regexp2.git
          fi
          cd regexp2
          git fetch --tags
          git checkout v1.1.8

          git clone --depth 1 https://github.com/go-sourcemap/sourcemap.git "$GOPATH/src/github.com/go-sourcemap/sourcemap"
          git clone --depth 1 https://github.com/yusufpapurcu/wmi.git "$GOPATH/src/github.com/yusufpapurcu/wmi"
          git clone --depth 1 https://github.com/go-ole/go-ole.git "$GOPATH/src/github.com/go-ole/go-ole"
          git clone --depth 1 https://github.com/ebitengine/purego.git "$GOPATH/src/github.com/ebitengine/purego"
          git clone --depth 1 https://github.com/tklauser/go-sysconf.git "$GOPATH/src/github.com/tklauser/go-sysconf"
          git clone --depth 1 https://github.com/tklauser/numcpus.git "$GOPATH/src/github.com/tklauser/numcpus"

          rm -rf "$GOPATH/src/github.com/herumi"
          mkdir -p "$GOPATH/src/github.com/herumi"
          git clone --depth 1 --recursive https://github.com/herumi/bls.git "$GOPATH/src/github.com/herumi/bls"

          cd "$GOPATH/src/github.com/herumi/bls"
          git submodule update --init --recursive

          cd "$GOPATH/src/github.com/herumi/bls/mcl"
          make clean || true
          rm -f src/bint_switch.hpp src/llvm_proto.hpp
          python3 src/gen_llvm_proto.py > src/llvm_proto.hpp
          make -j4 lib/libmcl.a MCL_FP_BIT=256 MCL_FR_BIT=256

          cd "$GOPATH/src/github.com/herumi/bls"
          rm -f obj/*.d obj/*.o lib/libbls256.a
          make -j4 MCL_FP_BIT=256 MCL_FR_BIT=256 lib/libbls256.a

          cd "${{ github.workspace }}/go/src/github.com/cypherium/cypher"

          mkdir -p crypto/bls/lib/darwin
          cp "$GOPATH/src/github.com/herumi/bls/lib/libbls256.a" crypto/bls/lib/darwin/libbls256.a
          cp "$GOPATH/src/github.com/herumi/bls/mcl/lib/libmcl.a" crypto/bls/lib/darwin/libmcl.a
          cp crypto/bls/lib/darwin/* crypto/bls/lib/

          COMMIT=$(git rev-parse HEAD)
          DATE=$(date +%Y%m%d)

          go env -w GO111MODULE=off

          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          GMP_PREFIX=$(brew --prefix gmp)

          export CGO_CFLAGS="-I$OPENSSL_PREFIX/include -I$GMP_PREFIX/include"
          export CGO_CXXFLAGS="$CGO_CFLAGS"
          export CGO_LDFLAGS="-L$OPENSSL_PREFIX/lib -L$GMP_PREFIX/lib"
          export LIBRARY_PATH="$OPENSSL_PREFIX/lib:$GMP_PREFIX/lib:${LIBRARY_PATH:-}"

          GOOS=darwin GOARCH=${{ matrix.goarch }} go build -trimpath -v \
            -ldflags "-X main.gitCommit=$COMMIT -X main.gitDate=$DATE" \
            -o "build/bin/cypher-darwin-${{ matrix.goarch }}" \
            ./cmd/cypher

          file "build/bin/cypher-darwin-${{ matrix.goarch }}"

      - name: Commit built macOS binary
        working-directory: ${{ github.workspace }}/go/src/github.com/cypherium/cypher
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build/bin/cypher-darwin-${{ matrix.goarch }}
          git commit -m "Update macOS binary (${{ matrix.goarch }})" || echo "No changes to commit"

          git push origin HEAD:EVM_Cancun_PoW

      - name: Upload cypher-macos
        uses: actions/upload-artifact@v4
        with:
          name: cypher-macos-${{ matrix.goarch }}
          path: ${{ github.workspace }}/go/src/github.com/cypherium/cypher/build/bin/cypher-darwin-${{ matrix.goarch }}
