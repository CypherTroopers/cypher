name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      GOPATH: C:\Users\runneradmin\go
      GO111MODULE: off
      CGO_ENABLED: 1
      CC: C:\msys64\mingw64\bin\gcc.exe
      CXX: C:\msys64\mingw64\bin\g++.exe

    steps:
      - uses: actions/checkout@v4
        with:
          path: go/src/github.com/cypherium/cypher

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            make

      - name: Build cypher.exe
        shell: pwsh
        working-directory: C:\Users\runneradmin\go\src\github.com\cypherium\cypher
        run: |
          Copy-Item .\crypto\bls\lib\win\* .\crypto\bls\lib\ -Force
          go env -w GO111MODULE=off
          go run build\ci.go install .\cmd\cypher

      - name: Upload cypher.exe
        uses: actions/upload-artifact@v4
        with:
          name: cypher-windows
          path: C:\Users\runneradmin\go\src\github.com\cypherium\cypher\build\bin\cypher.exe
