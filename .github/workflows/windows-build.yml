name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      GOPATH: ${{ github.workspace }}\go
      GO111MODULE: off
      CGO_ENABLED: 1
      CC: gcc
      CXX: g++

    steps:
      - name: Enable Git long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true
          git config --show-origin --get-all core.longpaths

      - uses: actions/checkout@v4
        with:
          ref: EVM_caucun_PoW_Test
          path: go/src/github.com/cypherium/cypher
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/vendor/github.com/consensys/gnark-crypto/internal/generator/addchain/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            make
            git
            python

      - name: Build cypher.exe
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}\go\src\github.com\cypherium\cypher
        run: |
          set -e

          mkdir -p "$GOPATH/src/github.com/VictoriaMetrics"
          mkdir -p "$GOPATH/src/github.com/shirou"
          mkdir -p "$GOPATH/src/golang.org/x"
          mkdir -p "$GOPATH/src/github.com/dlclark"
          mkdir -p "$GOPATH/src/github.com/go-sourcemap"
          mkdir -p "$GOPATH/src/github.com/yusufpapurcu"
          mkdir -p "$GOPATH/src/github.com/go-ole"

          git clone --depth 1 https://github.com/VictoriaMetrics/fastcache.git "$GOPATH/src/github.com/VictoriaMetrics/fastcache"
          git clone --depth 1 https://github.com/shirou/gopsutil.git "$GOPATH/src/github.com/shirou/gopsutil"
          git clone --depth 1 https://github.com/golang/sys.git "$GOPATH/src/golang.org/x/sys"

          cd "$GOPATH/src/github.com/dlclark"
          if [ ! -d regexp2 ]; then
            git clone https://github.com/dlclark/regexp2.git
          fi
          cd regexp2
          git fetch --tags
          git checkout v1.1.8

          git clone --depth 1 https://github.com/go-sourcemap/sourcemap.git "$GOPATH/src/github.com/go-sourcemap/sourcemap"
          git clone --depth 1 https://github.com/yusufpapurcu/wmi.git "$GOPATH/src/github.com/yusufpapurcu/wmi"
          git clone --depth 1 https://github.com/go-ole/go-ole.git "$GOPATH/src/github.com/go-ole/go-ole"

          rm -rf "$GOPATH/src/github.com/herumi"
          mkdir -p "$GOPATH/src/github.com/herumi"
          git clone --depth 1 --recursive https://github.com/herumi/bls.git "$GOPATH/src/github.com/herumi/bls"
          cd "$GOPATH/src/github.com/herumi/bls"
          git submodule update --init --recursive

          cd "$GOPATH/src/github.com/herumi/bls/mcl"
          make clean || true
          rm -f src/bint_switch.hpp src/llvm_proto.hpp
          python3 src/gen_llvm_proto.py > src/llvm_proto.hpp
          make -j4 OS=mingw64 lib/libmcl.a MCL_FP_BIT=256 MCL_FR_BIT=256

          cd "$GOPATH/src/github.com/herumi/bls"
          rm -f obj/*.d obj/*.o lib/libbls256.a
          make -j4 MCL_FP_BIT=256 MCL_FR_BIT=256 lib/libbls256.a

          cd "${{ github.workspace }}\go\src\github.com\cypherium\cypher"

          cp "$GOPATH/src/github.com/herumi/bls/lib/libbls256.a" crypto/bls/lib/win/libbls256.a
          cp "$GOPATH/src/github.com/herumi/bls/mcl/lib/libmcl.a" crypto/bls/lib/win/libmcl.a
          cp crypto/bls/lib/win/* crypto/bls/lib/

          COMMIT=$(git rev-parse HEAD)
          DATE=$(date +%Y%m%d)

          go env -w GO111MODULE=off

          go build -trimpath -v \
            -ldflags "-X main.gitCommit=$COMMIT -X main.gitDate=$DATE -extldflags=-Wl,--disable-dynamicbase" \
            -o build/bin/cypher.exe \
            ./cmd/cypher

          cp /mingw64/bin/libcrypto-3-x64.dll build/bin/ || true
          cp /mingw64/bin/libgmp-10.dll build/bin/ || true
          cp /mingw64/bin/libstdc++-6.dll build/bin/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/bin/ || true
          cp /mingw64/bin/libwinpthread-1.dll build/bin/ || true

          ./build/bin/cypher.exe version

      - name: Commit built Windows binary
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}\go\src\github.com\cypherium\cypher
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build/bin/cypher.exe build/bin/*.dll
          git commit -m "Update Windows binary" || echo "No changes to commit"

          git push origin HEAD:EVM_caucun_PoW_Test

      - name: Upload cypher-windows
        uses: actions/upload-artifact@v4
        with:
          name: cypher-windows
          path: |
            ${{ github.workspace }}\go\src\github.com\cypherium\cypher\build\bin\cypher.exe
            ${{ github.workspace }}\go\src\github.com\cypherium\cypher\build\bin\*.dll
