name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      GOPATH: ${{ github.workspace }}\go
      GO111MODULE: off
      CGO_ENABLED: 1
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          path: go/src/github.com/cypherium/cypher

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            make

      - name: Build cypher.exe
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}\go\src\github.com\cypherium\cypher
        run: |
          cp crypto/bls/lib/win/* crypto/bls/lib/

          COMMIT=$(git rev-parse HEAD)
          DATE=$(date +%Y%m%d)

          go env -w GO111MODULE=off

          go install -trimpath -v \
            -ldflags "-X main.gitCommit=$COMMIT -X main.gitDate=$DATE -extldflags=-Wl,--disable-dynamicbase" \
            ./cmd/cypher

          mkdir -p build/bin
          cp "$GOPATH/bin/cypher.exe" build/bin/cypher.exe

      - name: Upload cypher.exe
        uses: actions/upload-artifact@v4
        with:
          name: cypher-windows
          path: ${{ github.workspace }}\go\src\github.com\cypherium\cypher\build\bin\cypher.exe
