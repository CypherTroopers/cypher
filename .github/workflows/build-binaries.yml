name: Build Binaries

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'build/bin/cypher'
      - 'build/bin/cypher-linux-*'
      - 'build/bin/cypher-darwin-*'
      - 'build/bin/cypher.exe'
      - 'build/bin/*.dll'

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.2'

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            id: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: cypher-linux-amd64

          - name: macOS arm64
            id: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            artifact: cypher-macos-arm64

          - name: Windows amd64
            id: windows-amd64
            runner: windows-2022
            goos: windows
            goarch: amd64
            artifact: cypher-windows-amd64

    env:
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      SOURCE_SHA: ${{ github.sha }}
      CGO_ENABLED: '1'

    steps:
      - name: Enable Windows long paths
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install Linux native dependencies
        if: matrix.id == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            libgmp-dev \
            libssl-dev \
            python3

      - name: Install macOS native dependencies
        if: matrix.id == 'darwin-arm64'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install openssl@3 gmp

      - name: Set up MSYS2
        if: matrix.id == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            file
            git
            make
            python

      - name: Build native Cypher
        if: matrix.id != 'windows-amd64'
        shell: bash
        run: |
          set -euo pipefail
          make cypher TARGET_OS="${TARGET_OS}" TARGET_ARCH="${TARGET_ARCH}"

      - name: Build native Cypher
        if: matrix.id == 'windows-amd64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make cypher TARGET_OS="${TARGET_OS}" TARGET_ARCH="${TARGET_ARCH}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/stage/${{ matrix.id }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  commit-binaries:
    name: Commit binaries
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cypher-*
          path: artifacts

      - name: Validate and commit binaries
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: ./build/publish-binaries.sh
