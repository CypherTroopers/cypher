name: Build Binaries

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'build/bin/cypher'
      - 'build/bin/cypher-linux-*'
      - 'build/bin/cypher-darwin-*'
      - 'build/bin/cypher.exe'
      - 'build/bin/*.dll'

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon
    runs-on: macos-latest

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '1'
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup macOS native libs
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install openssl@3 gmp cmake

      - name: Build BLS libraries
        shell: bash
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/bls-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          git clone --depth 1 --recursive https://github.com/herumi/bls.git "$WORK/bls"

          cd "$WORK/bls"
          git submodule update --init --recursive

          cd "$WORK/bls/mcl"
          rm -f src/bint_switch.hpp src/llvm_proto.hpp
          python3 src/gen_llvm_proto.py > src/llvm_proto.hpp
          make -j4 lib/libmcl.a MCL_FP_BIT=256 MCL_FR_BIT=256

          cd "$WORK/bls"
          rm -f obj/*.d obj/*.o lib/libbls256.a
          make -j4 MCL_FP_BIT=256 MCL_FR_BIT=256 lib/libbls256.a

          mkdir -p crypto/bls/lib/darwin
          cp "$WORK/bls/lib/libbls256.a" crypto/bls/lib/darwin/libbls256.a
          cp "$WORK/bls/mcl/lib/libmcl.a" crypto/bls/lib/darwin/libmcl.a
          cp crypto/bls/lib/darwin/* crypto/bls/lib/

      - name: Build cypher darwin arm64
        shell: bash
        run: |
          set -euo pipefail

          export GO111MODULE=on
          export GOOS=darwin
          export GOARCH=arm64
          export CGO_ENABLED=1

          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          GMP_PREFIX=$(brew --prefix gmp)

          export CGO_CFLAGS="-I$OPENSSL_PREFIX/include -I$GMP_PREFIX/include"
          export CGO_CXXFLAGS="$CGO_CFLAGS"
          export CGO_LDFLAGS="-L$OPENSSL_PREFIX/lib -L$GMP_PREFIX/lib"
          export LIBRARY_PATH="$OPENSSL_PREFIX/lib:$GMP_PREFIX/lib:${LIBRARY_PATH:-}"

          go mod download
          make cypher

          cp -f build/bin/cypher build/bin/cypher-darwin-arm64
          chmod +x build/bin/cypher-darwin-arm64

          file build/bin/cypher-darwin-arm64

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: cypher-macos-arm64
          path: build/bin/cypher-darwin-arm64

  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: go.sum

      - name: Install required development packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ cmake libssl-dev openssl libgmp-dev \
            bzip2 m4 build-essential git curl libc-dev \
            wget texinfo nodejs npm pcscd

      - name: Prepare BLS libraries
        shell: bash
        run: |
          set -euo pipefail

          cp ./crypto/bls/lib/linux/* ./crypto/bls/lib/

      - name: Build cypher linux amd64
        shell: bash
        run: |
          set -euo pipefail

          export GO111MODULE=on
          export GOOS=linux
          export GOARCH=amd64
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++

          go mod download
          make cypher

          cp -f build/bin/cypher build/bin/cypher-linux-amd64

          chmod +x build/bin/cypher
          chmod +x build/bin/cypher-linux-amd64

          file build/bin/cypher
          file build/bin/cypher-linux-amd64

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: cypher-linux-amd64
          path: |
            build/bin/cypher
            build/bin/cypher-linux-amd64

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++

    steps:
      - name: Enable Git long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true
          git config --show-origin --get-all core.longpaths

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-openssl
            make
            git
            python

      - name: Build BLS libraries
        shell: msys2 {0}
        run: |
          set -e

          WORK="$RUNNER_TEMP/bls-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          git clone --depth 1 --recursive https://github.com/herumi/bls.git "$WORK/bls"

          cd "$WORK/bls"
          git submodule update --init --recursive

          cd "$WORK/bls/mcl"
          rm -f src/bint_switch.hpp src/llvm_proto.hpp
          python3 src/gen_llvm_proto.py > src/llvm_proto.hpp
          make -j4 OS=mingw64 lib/libmcl.a MCL_FP_BIT=256 MCL_FR_BIT=256

          cd "$WORK/bls"
          rm -f obj/*.d obj/*.o lib/libbls256.a
          make -j4 MCL_FP_BIT=256 MCL_FR_BIT=256 lib/libbls256.a

          cp "$WORK/bls/lib/libbls256.a" crypto/bls/lib/win/libbls256.a
          cp "$WORK/bls/mcl/lib/libmcl.a" crypto/bls/lib/win/libmcl.a
          cp crypto/bls/lib/win/* crypto/bls/lib/

      - name: Build cypher.exe
        shell: msys2 {0}
        run: |
          set -e

          export GO111MODULE=on
          export CGO_ENABLED=1
          export CC=gcc
          export CXX=g++

          COMMIT=$(git rev-parse HEAD)
          DATE=$(date +%Y%m%d)

          go mod download

          go build -trimpath -v \
            -ldflags "-X main.gitCommit=$COMMIT -X main.gitDate=$DATE -extldflags=-Wl,--disable-dynamicbase" \
            -o build/bin/cypher.exe \
            ./cmd/cypher

          cp /mingw64/bin/libcrypto-3-x64.dll build/bin/ || true
          cp /mingw64/bin/libgmp-10.dll build/bin/ || true
          cp /mingw64/bin/libstdc++-6.dll build/bin/ || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/bin/ || true
          cp /mingw64/bin/libwinpthread-1.dll build/bin/ || true

          ./build/bin/cypher.exe version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: cypher-windows
          path: |
            build/bin/cypher.exe
            build/bin/*.dll

  commit-binaries:
    name: Commit binaries
    runs-on: ubuntu-latest
    needs:
      - build-macos-arm64
      - build-linux-amd64
      - build-windows

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: cypher-macos-arm64
          path: artifacts/macos

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: cypher-linux-amd64
          path: artifacts/linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: cypher-windows
          path: artifacts/windows

      - name: Copy binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/bin

          find artifacts/macos -type f -name 'cypher-darwin-arm64' -exec cp {} build/bin/ \;

          find artifacts/linux -type f -name 'cypher' -exec cp {} build/bin/ \;
          find artifacts/linux -type f -name 'cypher-linux-amd64' -exec cp {} build/bin/ \;

          find artifacts/windows -type f -name 'cypher.exe' -exec cp {} build/bin/ \;
          find artifacts/windows -type f -name '*.dll' -exec cp {} build/bin/ \;

          chmod +x build/bin/cypher
          chmod +x build/bin/cypher-linux-amd64
          chmod +x build/bin/cypher-darwin-arm64

          ls -lah build/bin/

      - name: Commit built binaries
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"

          echo "Target branch: $TARGET_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          chmod +x build/bin/cypher
          chmod +x build/bin/cypher-linux-amd64
          chmod +x build/bin/cypher-darwin-arm64

          git add --chmod=+x build/bin/cypher
          git add --chmod=+x build/bin/cypher-linux-amd64
          git add --chmod=+x build/bin/cypher-darwin-arm64
          git add build/bin/cypher.exe

          find build/bin -maxdepth 1 -name '*.dll' -print0 | xargs -0 -r git add

          git ls-files -s \
            build/bin/cypher \
            build/bin/cypher-linux-amd64 \
            build/bin/cypher-darwin-arm64

          if git diff --cached --quiet; then
            echo "No binary changes to commit"
            exit 0
          fi

          git commit -m "Update macOS Linux and Windows binaries"

          git fetch origin "$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"

          git push origin HEAD:"$TARGET_BRANCH"

      - name: Checkout ColossusX-Miner repo
        uses: actions/checkout@v4
        with:
          repository: CypherTroopers/ColossusX-Miner
          ref: main
          token: ${{ secrets.COLOSSUSX_MINER_PAT }}
          path: ColossusX-Miner
          fetch-depth: 0

      - name: Sync binaries to ColossusX-Miner
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ github.workspace }}/ColossusX-Miner"
          SRC="${{ github.workspace }}/build/bin"

          rm -rf "$TARGET/build/bin"
          mkdir -p "$TARGET/build/bin"

          cp -f "$SRC/cypher" "$TARGET/build/bin/" || true
          cp -f "$SRC/cypher-linux-amd64" "$TARGET/build/bin/" || true
          cp -f "$SRC/cypher-darwin-arm64" "$TARGET/build/bin/" || true
          cp -f "$SRC/cypher.exe" "$TARGET/build/bin/" || true
          find "$SRC" -maxdepth 1 -name '*.dll' -exec cp -f {} "$TARGET/build/bin/" \;

          cp -f "${{ github.workspace }}/genesistest.json" "$TARGET/genesistest.json"

          cd "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f build/bin/cypher ] && chmod +x build/bin/cypher
          [ -f build/bin/cypher-linux-amd64 ] && chmod +x build/bin/cypher-linux-amd64
          [ -f build/bin/cypher-darwin-arm64 ] && chmod +x build/bin/cypher-darwin-arm64

          git add -A build/bin genesistest.json

          if git diff --cached --quiet; then
            echo "No ColossusX-Miner binary changes to commit"
            exit 0
          fi

          git commit -m "Update ColossusX miner binaries"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
