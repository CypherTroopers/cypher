name: Build Binaries (verification only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            id: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: cypher-linux-amd64

          - name: macOS arm64
            id: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            artifact: cypher-macos-arm64

          - name: Windows amd64
            id: windows-amd64
            runner: windows-2022
            goos: windows
            goarch: amd64
            artifact: cypher-windows-amd64

    env:
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      SOURCE_SHA: ${{ github.sha }}
      CGO_ENABLED: '1'

    steps:
      - name: Enable Windows long paths
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse mutable native dependency resolution
        if: matrix.id != 'windows-amd64'
        shell: bash
        run: |
          printf '%s\n' 'Native verification is fail-closed until apt/Homebrew snapshot identities are pinned. Use the Gate 0 immutable-image workflow for release evidence.' >&2
          exit 1

      - name: Refuse unpinned Windows toolchain
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: throw 'Windows release build is fail-closed until the reviewed setup-msys2 commit and package identities are pinned in repository policy.'
