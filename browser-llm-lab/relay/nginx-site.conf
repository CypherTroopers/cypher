# Relay proxy ranges verified 2026-10-03: https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/
geo $cypher_relay_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $cypher_relay_cloudflare $cypher_relay_client_ip {
    default $remote_addr;
    1 $http_cf_connecting_ip;
}
map $cypher_relay_cloudflare $cypher_relay_country {
    default "";
    1 $http_cf_ipcountry;
}
map $http_upgrade $cypher_relay_upgrade {
    default upgrade;
    "" close;
}

server {

    server_name ai-test.make-cph-great-again.community;

    client_max_body_size 10m;

    # Only the bounded gateway is exposed; the native Unix API stays private.
    location ^~ /relay/v1/mesh/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cypher_relay_upgrade;
        proxy_set_header X-Relay-Client-IP $cypher_relay_client_ip;
        proxy_set_header X-Relay-Country $cypher_relay_country;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Discovery accepts up to 16KiB; other APIs retain gateway-side 1KiB guards.
        client_max_body_size 16k;
        client_body_timeout 5s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        access_log off;
    }

    # Owner-only APIs and the former header namespace stay unpublished.
    location ^~ /relay/v1/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-test.make-cph-great-again.community/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-test.make-cph-great-again.community/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ai-test.make-cph-great-again.community) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name ai-test.make-cph-great-again.community;
    return 404; # managed by Certbot


}